# Configuración del REST Client
# URL base del servicio externo (JSONPlaceholder como ejemplo)
quarkus.rest-client.user-api.url=https://jsonplaceholder.typicode.com
quarkus.rest-client.user-api.scope=jakarta.inject.Singleton

# Configuración de timeouts
quarkus.rest-client.user-api.connect-timeout=5000
quarkus.rest-client.user-api.read-timeout=30000

# Configuración de logging
quarkus.log.level=INFO
quarkus.log.category."com.juniverse.client".level=DEBUG

# Puerto de la aplicación
quarkus.http.port=8080

# Configuración para desarrollo
quarkus.dev.ui.enabled=true

# Configuración para producción (opcional)
%prod.quarkus.rest-client.user-api.url=${API_URL:https://jsonplaceholder.typicode.com}
%prod.quarkus.rest-client.user-api.connect-timeout=${CONNECT_TIMEOUT:3000}
%prod.quarkus.rest-client.user-api.read-timeout=${READ_TIMEOUT:5000}

# Health check
quarkus.smallrye-health.extensions.enabled=true

# Métricas (opcional)
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# Configuración de Jackson para REST Client
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.fail-on-empty-beans=false
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.accept-case-insensitive-enums=true

# Configuración específica para REST Client
user-api/mp-rest/providers=com.juniverse.client.exception.RestClientExceptionMapper
# JAR único con todas las dependencias (fat jar): target/quarkus-client-<version>-runner.jar
quarkus.package.jar.type=uber-jar
